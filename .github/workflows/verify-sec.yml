name: verify-sec (temporary)
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 lxml python-dotenv
      - run: |
          python - <<'PY' 2>&1 | while IFS= read -r line; do echo "::notice::$line"; done
          import traceback
          from finance_llm import config
          from finance_llm.ingestion import ingest_sec_filing
          print("UA", config.SEC_USER_AGENT)
          for t, f in [("AAPL","10-K"), ("MSFT","10-Q"), ("TSLA","8-K")]:
              docs = ingest_sec_filing(t, f)
              if docs:
                  d = docs[0]
                  print("RESULT", t, f, "|", d["metadata"]["title"], "|", len(d["content"].split()), "words |", d["metadata"]["source"])
                  if t == "AAPL": print("SAMPLE", " ".join(d["content"].split()[300:350]))
              else:
                  print("EMPTY", t, f)
          PY

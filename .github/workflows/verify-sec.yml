name: verify-sec (temporary)
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 lxml python-dotenv
      - env:
          SEC_USER_AGENT: "FinanceLLM-CI mutima89@users.noreply.github.com"
        run: |
          python - <<'PY'
          from finance_llm.ingestion import ingest_sec_filing
          for t, f in [("AAPL","10-K"), ("MSFT","10-Q"), ("TSLA","8-K")]:
              docs = ingest_sec_filing(t, f)
              assert docs, f"no docs for {t} {f}"
              d = docs[0]
              words = len(d["content"].split())
              print(t, f, "|", d["metadata"]["title"], "|", words, "words |", d["metadata"]["source"])
              assert words > 300, "too little text"
          print("SAMPLE:", " ".join(ingest_sec_filing("AAPL","10-K")[0]["content"].split()[200:260]))
          PY

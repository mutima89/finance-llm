name: verify-sec (temporary)
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 lxml python-dotenv
      - env:
          SEC_USER_AGENT: "FinanceLLM-CI mutima89@users.noreply.github.com"
        run: |
          python - <<'PY' 2>&1 | while IFS= read -r line; do echo "::notice::$line"; done
          import requests, re
          for ua in ["Mutima Research mutima89@users.noreply.github.com", "FinanceLLM admin@example.com", "Mozilla/5.0 (X11; Linux x86_64)"]:
              r = requests.get("https://www.sec.gov/files/company_tickers.json", headers={"User-Agent": ua, "Accept-Encoding": "gzip, deflate"}, timeout=30)
              t = re.sub(r"<[^>]+>", " ", r.text); t = re.sub(r"\s+", " ", t)
              print("UA", repr(ua), r.status_code, t[:260] if r.status_code != 200 else "OK")
          print("IP", requests.get("https://api.ipify.org", timeout=15).text)
          PY
